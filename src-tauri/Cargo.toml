[package]
name = "rustscan-neon"
version = "2.4.1"
edition = "2021"
description = "RustScan Neon Grid — async port reconnaissance terminal"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
rustscan = { path = "../engine" }
ipnet = "2"
rfd = "0.15"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
